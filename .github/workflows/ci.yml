name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run check          # static safety checks, render test of every screen, push function tests
      - run: npm run build
      - name: No secrets in the built site
        run: "! grep -rIl 'service_role' dist src public functions"
